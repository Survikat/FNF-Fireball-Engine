name: Build Fireball Engine

on:
  push:
    branches:
      - release

  pull_request:
    branches:
      - "**"

  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          - target: windows
            build-name: Build for Windows
            runs-on: windows-latest

          - target: linux
            build-name: Build for Linux
            runs-on: ubuntu-latest

    name: ${{ matrix.build-name }}
    runs-on: ${{ matrix.runs-on }}
            
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libvlc-dev \
            libvlccore-dev

      - name: Install Haxelib dependencies
        run: |
          haxelib install hmm
          haxelib run hmm setup
          haxelib run hmm install
          haxelib run lime setup
          haxelib run lime setup flixel
      
      - name: Build target
        run: haxelib run lime build ${{ matrix.target }} -release
      
      - name: Upload target build
        uses: actions/upload-artifact@v4
        with:
          name: fireball-engine_${{ matrix.target }}
          path: export/release/${{ matrix.target }}/bin/