# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!
      
      - name: Prepare for Windows builds
        run: |
          sudo apt-get install mingw-w64 mingw-w64-tools -y
        
      - name: Prepare Haxe and HaxeFlixel
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install -y haxe neko
          
          mkdir ~/haxelib -p
          haxelib setup ~/haxelib

          haxelib --global update haxelib
          
          haxelib install flixel
          haxelib install lime
          haxelib install openfl
          haxelib install all
          
          haxelib run lime setup
          haxelib run lime setup flixel
          
          haxelib update flixel

      # Linux Builds
      - name: Compile for Linux (Debug)
        run: haxelib run lime build linux -debug

      - name: Upload Linux Debug Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug-build
          path: "export/debug/linux/bin/"
        
      - name: Compile for Linux (Release)
        run: haxelib run lime build linux -release

      - name: Upload Linux Release Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-build
          path: "export/release/linux/bin/"
      
      - name: Compile for Windows (Debug)
        run: | 
          haxelib fixrepo
          haxelib run lime build windows -Dmingw -64 -debug

      - name: Upload Windows Debug Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-build
          path: "export/debug/windows/bin/"
          
      - name: Compile for Windows (Release)
        run: |
          haxelib fixrepo
          haxelib run lime build windows -Dmingw -64 -release

      - name: Upload Windows Release Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-build
          path: "export/release/windows/bin/"
